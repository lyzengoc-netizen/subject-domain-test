name: dry-run

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: validate dilemma set
        run: python -c "import json;d=json.load(open('dilemmas.json'));print(len(d['items']),'items')"
      - name: render prompts (no API calls)
        run: python run.py --dry-run > /dev/null && echo ok
